---
- name: "control_plane_hostname を全ノードの /etc/hosts に登録"
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "\\s{{ control_plane_hostname }}$"
    line: "{{ hostvars[kubeadm_init_host].ansible_host }} {{ control_plane_hostname }}"
    state: present
  # control-plane の実IPが変わった(引っ越し等)場合は、inventory の
  # ansible_host を更新してこのタスクを再実行すれば全ノードの解決先が追随する。
  # kubeadm 証明書の SAN は control_plane_hostname(固定値)なので再発行は不要。

- name: "control_plane_hostname を cloud-init の /etc/hosts テンプレートにも登録"
  # Ubuntu cloud image はデフォルトで manage_etc_hosts: true になっており、
  # cloud-init の update_etc_hosts モジュールは毎回起動時に
  # /etc/cloud/templates/hosts.debian.tmpl から /etc/hosts を再生成する
  # (これにより上のタスクで追記した行が再起動の度に消え、kubectl 等が
  # 名前解決に失敗する不具合が実機で発生した)。
  # manage_etc_hosts を無効化するのではなく、cloud-init 自身が再生成の元にする
  # テンプレート側に静的な行を加えることで、再生成後も内容を保持させる
  # (cloud-init が生成する /etc/hosts のコメントで案内されている正規の対処法)。
  ansible.builtin.lineinfile:
    path: /etc/cloud/templates/hosts.debian.tmpl
    regexp: "\\s{{ control_plane_hostname }}$"
    line: "{{ hostvars[kubeadm_init_host].ansible_host }} {{ control_plane_hostname }}"
    state: present

- name: swap を無効化(kubelet の前提条件)
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: true

- name: /etc/fstab の swap エントリをコメントアウト
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: 起動時にロードするカーネルモジュールを設定
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: overlay / br_netfilter モジュールをロード
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: k8s 用 sysctl パラメータを設定
  # NOTE: kernel.unprivileged_bpf_disabled は "write once" な特殊なsysctlで、
  # 既にUbuntuのデフォルト設定(多くの場合"2")になっている場合、reload:true
  # による動的反映では効果がなく、ノードの再起動が必須。
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/k8s.conf
    reload: true
  loop:
    - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
    - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
    - { name: net.ipv4.ip_forward, value: "1" }
    - { name: kernel.unprivileged_bpf_disabled, value: "0" }

- name: 必要な apt パッケージをインストール
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: "Python kubernetes ライブラリをインストール(control-plane のみ)"
  # cni_calico / argocd_bootstrap ロールが使う kubernetes.core.k8s モジュールは、
  # 実行対象ホスト(= control-plane)側に Python の kubernetes ライブラリが
  # 無いと "Failed to import the required Python library (kubernetes)" で失敗する。
  ansible.builtin.apt:
    name: python3-kubernetes
    state: present
  when: inventory_hostname == kubeadm_init_host
