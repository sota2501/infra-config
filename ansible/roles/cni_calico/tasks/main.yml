---
# control-plane ホストで kubectl を使い Calico(Tigera operator)を適用する。

- name: Tigera operator を適用
  kubernetes.core.k8s:
    state: present
    src: https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/tigera-operator.yaml
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"

- name: Calico Installation(pod_network_cidrを反映)を適用
  kubernetes.core.k8s:
    state: present
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
    apply: true
    definition:
      apiVersion: operator.tigera.io/v1
      kind: Installation
      metadata:
        name: default
      spec:
        calicoNetwork:
          ipPools:
            - name: default-ipv4-ippool
              blockSize: 26
              cidr: "{{ pod_network_cidr }}"
              encapsulation: VXLANCrossSubnet
              natOutgoing: Enabled
              nodeSelector: all()
              allowedUses:
                - Workload
                - Tunnel
              disableBGPExport: false

- name: Calico APIServer を適用
  kubernetes.core.k8s:
    state: present
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
    apply: true
    definition:
      apiVersion: operator.tigera.io/v1
      kind: APIServer
      metadata:
        name: default
      spec: {}
