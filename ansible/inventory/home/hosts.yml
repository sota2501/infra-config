all:
  children:
    k8s_cluster:
      children:
        control_plane:
          hosts:
            cp-1:
              ansible_host: 192.168.1.11
        workers:
          hosts:
            worker-1:
              ansible_host: 192.168.1.21
            worker-2:
              ansible_host: 192.168.1.22
      vars:
        ansible_user: ubuntu
        ansible_python_interpreter: /usr/bin/python3
