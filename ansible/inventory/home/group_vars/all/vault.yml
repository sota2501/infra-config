# k8s-manifests (private リポジトリ) への読み取り用 GitHub PAT。
#
# 1. GitHub で fine-grained PAT を発行する
#    (対象リポジトリ: k8s-manifests, 権限: Contents read-only)
# 2. このファイルの値を実際のトークンに書き換える
# 3. 以下のコマンドで暗号化する(このファイル自体を暗号化してコミットする):
#      ansible-vault encrypt ansible/inventory/home/group_vars/all/vault.yml
# 4. ansible-playbook 実行時は --ask-vault-pass か --vault-password-file を付与する
#
# NOTE: プレースホルダのままコミットしないこと。暗号化前提のファイルなので、
#       実トークンを書いたら必ず上記 3 を実行してから commit すること。
gitops_repo_token: "CHANGEME"
