[defaults]
# エディタ/ansible-lint 用: リポジトリルートを作業ディレクトリとして開いた場合の
# ansible.cfg 検出用(ansible-core/ansible-lint は cwd 直下の ansible.cfg しか自動検出しないため)。
# ansible/ ディレクトリを cwd にして CLI 実行する場合は ansible/ansible.cfg の方が使われる。
# 実体を変更する際は ansible/ansible.cfg と両方揃えること。
inventory = ansible/inventory/home/hosts.yml
roles_path = ansible/roles
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False

[privilege_escalation]
become = True
become_method = sudo
